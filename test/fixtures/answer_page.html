<!DOCTYPE html>
<html>
<head><title>示例回答 - 知乎</title></head>
<body>
<div class="QuestionAnswer-content">
  <div class="AnswerCard">
    <div class="RichContent">
      <div class="RichContent-inner">
        <style>.RichContent img { max-width: 100%; }</style>
        <h2>小标题</h2>
        <p>这是正文的第一段，含一个 <b>加粗</b> 与 <a href="https://example.com/ref">普通链接</a>。</p>
        <img src="https://pic1.zhimg.com/v2-demo-pic_1440w.jpg" alt="示意图">
        <p>
          <a class="LinkCard" href="https://example.com/card" data-text="卡片标题示例">https://example.com/card</a>
        </p>
        <p>正文里的邮箱 aaa@bbb.ccc 会被知乎包成 mailto 链接。</p>
        <p><a href="mailto:aaa@bbb.ccc">aaa@bbb.ccc</a></p>
        <img src="data:image/svg+xml;base64,PHN2Zy8+">
        <ul>
          <li><a aria-label="back" href="#ref_1">返回引用</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body>
</html>
