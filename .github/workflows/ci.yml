name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 语法自检
        run: python -m compileall -q main.py fetch_collections.py get_collections.py utils.py zhihu_export tools

      - name: 检查文档内部锚点
        run: python tools/check_readme_anchors.py README.md CHANGELOG.md CONTRIBUTING.md

      - name: 运行测试（全部离线，不联网、不需要 cookies）
        run: pytest
